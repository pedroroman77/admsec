<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AdmSec+</title>
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#132D60">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AdmSec+">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#FFFFFF; --surface:#F3F6F7; --ink:#20303A; --muted:#67808E;
  --red:#CB333B; --red-dark:#A7262E; --red-soft:rgba(203,51,59,.10);
  --slate:#425563; --slate-deep:#2C3B47;
  --naranja:#D9710C; --naranja-soft:rgba(217,113,12,.12);
  --verde:#2E7D46; --verde-soft:rgba(46,125,70,.12);
  --line:rgba(66,85,99,.18); --line-soft:rgba(66,85,99,.09);
  --pri:#132D60; --pri-ink:#132D60; --pri-soft:rgba(19,45,96,.08); --pri-line:rgba(19,45,96,.35);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --nav:3.9rem;
  box-sizing:border-box; color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171C; --surface:#182329; --ink:#E7EDF0; --muted:#94A8B3;
    --red:#E4616A; --red-dark:#CB333B; --red-soft:rgba(228,97,106,.14);
    --slate:#8AA3B2; --slate-deep:#132029;
    --naranja:#F0954A; --naranja-soft:rgba(240,149,74,.16);
    --verde:#5FBF7D; --verde-soft:rgba(95,191,125,.16);
    --line:rgba(231,237,240,.16); --line-soft:rgba(231,237,240,.08);
    --pri:#3D62A6; --pri-ink:#A9C1EE; --pri-soft:rgba(169,193,238,.13); --pri-line:rgba(169,193,238,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#182329; --ink:#E7EDF0; --muted:#94A8B3;
  --red:#E4616A; --red-dark:#CB333B; --red-soft:rgba(228,97,106,.14);
  --slate:#8AA3B2; --slate-deep:#132029;
  --naranja:#F0954A; --naranja-soft:rgba(240,149,74,.16);
  --verde:#5FBF7D; --verde-soft:rgba(95,191,125,.16);
  --line:rgba(231,237,240,.16); --line-soft:rgba(231,237,240,.08);
    --pri:#3D62A6; --pri-ink:#A9C1EE; --pri-soft:rgba(169,193,238,.13); --pri-line:rgba(169,193,238,.4);
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:none;
  font-family:Rubik,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  font-size:16px;line-height:1.5;
}
h1,h2,h3{font-family:Rubik,"Segoe UI",system-ui,Arial,sans-serif;font-weight:500;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:520px;margin:0 auto;min-height:100%;background:var(--bg);position:relative}
@media (min-width:521px){.app{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}}

/* cabecera con barra corporativa */
.cab{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(var(--top) + .75rem) 1rem .6rem;
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:.7rem;
}
.cab::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--top) + 4px);background:var(--red)}
.marca{flex:0 0 auto;display:flex;align-items:baseline;font-weight:700;letter-spacing:-.02em;font-size:1.02rem;color:var(--slate-deep)}
:root[data-theme="dark"] .marca,:root:not([data-theme="light"]) .marca{color:var(--ink)}
.marca i{font-style:normal;color:var(--red);font-weight:700;margin-left:.05rem}
.cab h1{font-size:1.05rem;font-weight:500;flex:1;text-align:right;color:var(--muted)}
.cab .sub{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.cab button{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:2.3rem;height:2.3rem;cursor:pointer;color:var(--muted)}
.cuerpo{padding:1rem 1rem calc(var(--nav) + var(--bot) + 5rem)}
.view[hidden]{display:none}

/* navegación inferior */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--bg);border-top:1px solid var(--line-soft);
  padding-bottom:var(--bot);display:flex;
  box-shadow:0 -2px 14px rgba(32,48,58,.07);
}
@media (min-width:521px){.nav{max-width:520px;margin:0 auto}}
.nav button{
  flex:1;background:none;border:0;color:var(--muted);cursor:pointer;
  padding:.5rem .1rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;
  font-size:.6rem;min-height:var(--nav);justify-content:center;position:relative;white-space:nowrap;
}
.nav .gl{font-size:1.15rem;line-height:1}
.nav button[aria-current="true"]{color:var(--red);font-weight:500}
.nav button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--red);border-radius:0 0 3px 3px}
.fab{
  position:fixed;z-index:41;right:max(1rem,calc(50vw - 260px + 1rem));
  bottom:calc(var(--nav) + var(--bot) + .9rem);
  width:3.4rem;height:3.4rem;border-radius:16px;border:0;
  background:var(--red);color:#fff;font-size:1.6rem;line-height:1;
  box-shadow:0 6px 16px rgba(203,51,59,.35);cursor:pointer;
}

/* hoy */
.hero{background:var(--surface);border-radius:16px;padding:1rem 1.05rem;margin-bottom:1.4rem;border-left:4px solid var(--red)}
.hero .curso{color:var(--muted);font-size:.76rem;text-transform:none}
.hero .fecha{font-size:1.65rem;font-weight:500;letter-spacing:-.02em;margin:.15rem 0 .35rem}
.hero .res{color:var(--muted);font-size:.9rem;margin:0}
.hero .res b{color:var(--red);font-weight:700}
.bloque{margin-bottom:1.7rem}
.bloque h2{font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-bottom:.5rem}
.bloque .nota{margin:-.3rem 0 .5rem;color:var(--muted);font-size:.82rem}

/* agenda día a día */
.agenda{position:relative}
.diabloque{padding:.7rem 0;border-bottom:1px solid var(--line-soft)}
.diabloque:last-child{border-bottom:0}
.diabloque .tareas{margin-top:.5rem}
.diafecha{display:flex;align-items:baseline;gap:.5rem}
.diafecha-n{font-size:1.05rem;font-weight:700;color:var(--ink);min-width:1.4rem}
.diafecha-t{font-size:.78rem;color:var(--muted);text-transform:capitalize}
.diafecha.finde .diafecha-n{color:var(--red)}
.diavacio{margin:.4rem 0 0;color:var(--muted);font-size:.82rem;font-style:italic}

/* tareas */
.tareas{list-style:none;margin:0;padding:0}
.tarea{display:flex;gap:.7rem;align-items:center;background:var(--bg);
  border:1px solid var(--line-soft);border-radius:14px;padding:.6rem .7rem;margin-bottom:.5rem}
.check{flex:0 0 auto;width:2rem;height:2rem;border:1.5px solid var(--line);border-radius:8px;
  background:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:.9rem}
.check[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
.fecha-col{flex:0 0 2.5rem;text-align:center;line-height:1.05;background:var(--surface);border-radius:8px;padding:.22rem 0}
.fecha-col .d{font-size:1.1rem;font-weight:700;color:var(--slate)}
.fecha-col .m{font-size:.6rem;color:var(--muted)}
.tarea .txtb{flex:1;min-width:0;text-align:left;background:none;border:0;padding:.25rem 0;cursor:pointer}
.tarea .t{display:block;font-weight:500;font-size:.95rem}
.tarea.hecha{background:var(--verde-soft);border-color:var(--verde-soft);border-left:3px solid var(--verde)}
.tarea.hecha .t{text-decoration:line-through;color:var(--verde);font-weight:400}
.tarea.hecha .meta{color:var(--verde);opacity:.8}
.tarea.hecha .check[aria-pressed="true"]{background:var(--verde);border-color:var(--verde)}
.tarea .meta{display:block;color:var(--muted);font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--line);flex:0 0 auto;font-size:1.1rem}
.pill{display:inline-block;font-size:.66rem;padding:.06rem .45rem;border-radius:5px;background:var(--naranja-soft);color:var(--naranja);font-weight:500}
.pill.urg{background:var(--naranja-soft);color:var(--naranja)}
.pill.reunion{background:var(--surface);color:var(--slate);border:1px solid var(--line);margin-left:.4rem;font-weight:500;text-transform:none}
.pill.no-realizada{background:var(--naranja-soft);color:var(--naranja);margin-left:.4rem;font-weight:500;text-transform:none}
.tarea.no-realizada,.tarea.vencida{background:var(--naranja-soft);border-color:var(--naranja-soft);border-left:3px solid var(--naranja)}
.tarea.no-realizada .t,.tarea.vencida .t{text-decoration:underline;text-decoration-color:var(--naranja);text-decoration-thickness:2px;text-underline-offset:.15em;color:var(--naranja);font-weight:500}
.tarea.no-realizada .meta,.tarea.vencida .meta{color:var(--naranja);opacity:.85}
.nota-rango{margin:-.5rem 0 .9rem;color:var(--muted);font-size:.78rem;line-height:1.4}
.aviso-lunes{background:var(--naranja-soft);border-left:3px solid var(--naranja);border-radius:0 12px 12px 0;padding:.8rem .9rem;margin-bottom:1.3rem}
.aviso-lunes strong{display:block;font-size:.9rem;margin-bottom:.25rem;color:var(--ink)}
.aviso-lunes p{margin:0 0 .6rem;color:var(--muted);font-size:.84rem;line-height:1.4}
.aviso-lunes button{background:none;border:1px solid var(--line);border-radius:8px;padding:.35rem .75rem;font-size:.82rem;color:var(--ink);cursor:pointer}
.tarea.reunion{border-left:3px solid var(--slate)}
.check.cerrada{opacity:.75;cursor:not-allowed}
.tarea.cerrada .meta{opacity:.95}
.bloque-atrasadas h2{color:var(--naranja)}
.nota-lista{font-size:.8rem;color:var(--muted);margin:-.2rem 0 .9rem}
.bloque-mes h2{text-transform:capitalize}
.bloque-mes.mes-actual h2{color:var(--pri-ink);border-bottom-color:var(--pri-line)}
.diahead-fila{display:flex;align-items:center;gap:.6rem;margin:1.4rem 0 .6rem}
.diahead-fila .diahead{margin:0;flex:1;min-width:0}
.btn-abrir-hoy{flex:0 0 auto;border:1px solid var(--red);color:var(--red);background:none;border-radius:999px;padding:.35rem .85rem;font-size:.82rem;font-weight:600;cursor:pointer}
.pasados-btn{width:100%;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:.6rem;color:var(--slate);font-size:.86rem;cursor:pointer;margin-bottom:.6rem}
.pasados .diabloque{opacity:.92}
.separador-gris{border:1px solid var(--line);border-radius:8px;padding:.4rem .6rem;margin:.9rem 0 1.1rem;
  text-align:center;font-size:.72rem;font-weight:500;color:var(--red);background:var(--surface)}

/* selector segmentado tarea/reunión */
.segmentado{display:flex;background:var(--surface);border-radius:12px;padding:.2rem;gap:.2rem}
.segmentado button{flex:1;border:0;background:none;padding:.55rem 0;border-radius:9px;font-size:.9rem;color:var(--muted);cursor:pointer}
.segmentado button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(32,48,58,.12)}

/* calendario */
.calbar{display:flex;align-items:center;gap:.4rem;margin-bottom:.8rem}
.calbar h2{font-size:1.05rem;font-weight:500;flex:1;text-transform:capitalize}
.calbar button{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;min-width:2.3rem;height:2.3rem;cursor:pointer;color:var(--slate)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:.65rem;color:var(--muted);padding-bottom:.25rem;font-weight:500}
.dia{aspect-ratio:1/1;background:var(--surface);border:1.5px solid transparent;border-radius:10px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.18rem;
  font:inherit;font-size:.88rem;padding:0;color:var(--ink)}
.dia.fuera{background:transparent;color:var(--muted);opacity:.4}
.dia.hoy{border-color:var(--red);color:var(--red);font-weight:700}
.dia.sel{background:var(--slate);color:#fff;border-color:var(--slate)}
.dia.sel .dot{background:#fff}
.dots{display:flex;gap:2px;height:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--slate)}
.dot.done{background:var(--verde)}
.dot.no-realizada,.dot.vencida{background:var(--naranja)}
.diahead{margin:1.4rem 0 .6rem;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}

/* manuales */
.buscar{margin-bottom:.7rem}
.buscar input{width:100%;padding:.72rem .85rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cats{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:.4rem;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{background:var(--surface);border:1px solid var(--line-soft);color:var(--muted);border-radius:8px;padding:.32rem .75rem;font-size:.8rem;white-space:nowrap;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.manuales{list-style:none;margin:0;padding:0}
.manual{margin-bottom:.5rem}
.manual button{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line-soft);
  border-radius:14px;padding:.8rem .85rem;cursor:pointer;display:flex;gap:.7rem;align-items:center;border-left:4px solid var(--slate)}
.manual .info{flex:1;min-width:0}
.manual h3{font-size:.98rem;font-weight:500}
.manual .desc{color:var(--muted);font-size:.8rem;margin:.15rem 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* botones */
.btn{border:1px solid var(--red);background:var(--red);color:#fff;border-radius:12px;padding:.78rem 1rem;cursor:pointer;font-size:.94rem;font-weight:500;width:100%;display:block;text-align:center;text-decoration:none}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--bg);color:var(--red);border-color:var(--line)}
.acciones{display:grid;gap:.5rem;margin:1.2rem 0 0}
.vacio{border:1px dashed var(--line);border-radius:14px;padding:1.2rem;text-align:center;color:var(--muted)}
.vacio p{margin:0 0 .8rem;font-size:.9rem}
.aviso{background:var(--surface);border-left:3px solid var(--red);padding:.7rem .85rem;font-size:.84rem;color:var(--muted);border-radius:0 10px 10px 0;margin:1rem 0}
.lista-ajustes{list-style:none;margin:0;padding:0}
.lista-ajustes li{border-bottom:1px solid var(--line-soft)}
.lista-ajustes button{width:100%;background:none;border:0;padding:.95rem .2rem;text-align:left;cursor:pointer;display:flex;gap:.8rem;align-items:center}
.lista-ajustes .gl{width:1.9rem;height:1.9rem;flex:0 0 auto;display:grid;place-items:center;border-radius:8px;background:var(--red-soft);color:var(--red);font-size:.9rem}
.lista-ajustes strong{font-weight:500}
.lista-ajustes small{display:block;color:var(--muted);font-size:.76rem;font-weight:400}

/* hoja inferior */
.overlay{position:fixed;inset:0;background:rgba(20,32,40,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:.5rem 1rem calc(1.5rem + var(--bot));
  animation:subir .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes subir{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.asa{width:2.4rem;height:4px;border-radius:99px;background:var(--line);margin:.35rem auto .7rem}
.sheet-top{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.7rem;position:sticky;top:0;background:var(--bg);padding-bottom:.4rem;z-index:2}
.sheet-top h2{font-size:1.15rem;font-weight:500;flex:1}
.cerrar{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:2.2rem;height:2.2rem;cursor:pointer;flex:0 0 auto;color:var(--muted)}
.campo{display:block;margin-bottom:.85rem}
.campo > span{display:block;font-size:.76rem;color:var(--muted);margin-bottom:.28rem;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;padding:.72rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.campo textarea{min-height:8rem;resize:vertical;line-height:1.5}
.fila{display:flex;gap:.6rem}
.fila > *{flex:1}
.dato{border-top:1px solid var(--line-soft);padding:.55rem 0;font-size:.92rem}
.dato .k{color:var(--muted);font-size:.73rem;display:block;font-weight:500}
.pasos{list-style:none;margin:.4rem 0 0;padding:0;counter-reset:p}
.pasos li{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--line-soft)}
.pasos .num{counter-increment:p;flex:0 0 1.5rem;height:1.5rem;display:grid;place-items:center;border-radius:50%;
  background:var(--red-soft);color:var(--red);font-size:.75rem;font-weight:700;margin-top:.1rem}
.pasos .num::before{content:counter(p)}
.pasos .txt{flex:1;font-size:.93rem}
.pasos li.ok .txt{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--bot) + 1.2rem);
  background:var(--slate-deep);color:#fff;padding:.6rem 1.1rem;border-radius:10px;z-index:80;font-size:.86rem;max-width:90%;text-align:center}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{background:var(--surface);border:1px solid var(--line)}
.toast[hidden]{display:none}
a{color:var(--red)}

/* ======== aspecto más claro: días y tareas ======== */
.bloque h2{font-size:.9rem;color:var(--ink);letter-spacing:.05em;padding-bottom:.45rem;border-bottom:2px solid var(--line);margin-bottom:.7rem}
.diabloque{padding:.85rem 0 .9rem;border-bottom:1px solid var(--line)}
.diabloque .tareas{margin-top:.65rem}
.diafecha{display:flex;align-items:center;gap:.75rem}
.diafecha-badge{flex:0 0 3.1rem;height:3.1rem;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.diafecha-dow{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.diafecha .diafecha-n{font-size:1.3rem;font-weight:700;color:var(--ink);min-width:0;margin-top:.12rem}
.diafecha-txt{display:flex;flex-direction:column;min-width:0}
.diafecha-nombre{font-size:1.02rem;font-weight:600;color:var(--ink);text-transform:capitalize;display:flex;align-items:center;gap:.45rem}
.diafecha .diafecha-t{font-size:.8rem;color:var(--muted);text-transform:none}
.etq-dia{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.12rem .45rem;border-radius:6px;background:var(--surface);color:var(--slate);border:1px solid var(--line)}
.etq-dia.hoy{background:var(--red);color:#fff;border-color:var(--red)}
.diafecha.eshoy .diafecha-badge{background:var(--red);border-color:var(--red)}
.diafecha.eshoy .diafecha-badge *{color:#fff}
.diafecha.finde .diafecha-badge{background:var(--red-soft);border-color:transparent}
.diafecha.finde .diafecha-n{color:var(--red)}
.diafecha.eshoy.finde .diafecha-n{color:#fff}
.diafecha.pasado .diafecha-nombre{color:var(--muted)}
/* días sin tareas: una línea discreta */
.diabloque.vacio-dia{padding:.5rem 0}
.diabloque.vacio-dia .diafecha-badge{flex-basis:2.4rem;height:2.4rem;opacity:.75}
.diabloque.vacio-dia .diafecha-dow{font-size:.55rem}
.diabloque.vacio-dia .diafecha-n{font-size:1rem}
.diabloque.vacio-dia .diafecha-nombre{font-size:.9rem;font-weight:500;color:var(--muted)}
.diabloque.vacio-dia .diafecha-t{font-size:.74rem}
.diabloque.vacio-dia .diafecha.eshoy .diafecha-badge{opacity:1}
.diabloque.vacio-dia .diafecha.eshoy .diafecha-nombre{color:var(--ink);font-weight:600}

/* ======== TABLET (pantallas grandes) ======== */

@media (min-width:768px) and (min-height:500px){

  .cab{padding-left:1.5rem;padding-right:1.5rem}
  .cuerpo{padding:1.4rem 1.5rem calc(var(--bot) + 6rem)}

  /* barra de navegación -> columna lateral */
  .nav{top:0;bottom:0;right:auto;width:var(--rail);max-width:none;margin:0;flex-direction:column;justify-content:flex-start;
    padding:calc(var(--top) + 4.6rem) 0 var(--bot);border-top:0;border-right:1px solid var(--line-soft);box-shadow:2px 0 14px rgba(32,48,58,.05)}
  .nav::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--top) + 4px);background:var(--red)}
  .nav button{flex:0 0 auto;min-height:4.6rem;font-size:.72rem;gap:.3rem}
  .nav .gl{font-size:1.35rem}
  .nav button[aria-current="true"]{background:var(--red-soft)}
  .nav button[aria-current="true"]::before{top:18%;bottom:18%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .fab{right:1.6rem;bottom:calc(var(--bot) + 1.6rem)}
  .toast{bottom:calc(var(--bot) + 1.6rem)}

  /* Hoy: resumen a la izquierda, agenda a la derecha */

  #dia-detalle{grid-column:2;grid-row:1 / span 2;position:sticky;top:calc(var(--top) + 5rem)}
  #dia-detalle .diahead-fila{margin-top:.2rem}
  .dia{font-size:1rem;border-radius:12px}
  .dots{gap:3px}.dot{width:6px;height:6px}

  /* Tareas y Manuales: lista a la izquierda, detalle a la derecha */
  .cuerpo.con-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.5rem;align-items:start}
  .cuerpo.con-panel > .view{grid-column:1;grid-row:1}
  .panel{grid-column:2;grid-row:1;position:sticky;top:calc(var(--top) + 5rem);
    max-height:calc(100vh - var(--top) - 6.5rem);max-height:calc(100dvh - var(--top) - 6.5rem);overflow-y:auto;
    background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:.9rem 1.1rem 1.2rem}
  .panel .sheet-top{padding-top:.2rem}
  .tarea.activa,.manual.activa button{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}

  /* ventanas: centradas en vez de subir desde abajo */
  .overlay{align-items:center;padding:1.5rem}
  .sheet{max-width:640px;border-radius:20px;max-height:88vh;max-height:88dvh;padding:1rem 1.4rem 1.5rem}
  .sheet .asa{display:none}

  .vacio{padding:2rem}
}

.btn{background:var(--pri);border-color:var(--pri)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}

a{color:var(--pri-ink)}
.fab{background:var(--red);font-size:0;display:grid;place-items:center}
.fab::before{content:"";width:1.4rem;height:1.4rem;background:
  linear-gradient(#fff,#fff) center/100% 3px no-repeat,linear-gradient(#fff,#fff) center/3px 100% no-repeat}

/* tareas atrasadas: señal clara pero sin subrayados */

.tarea.no-realizada .meta,.tarea.vencida .meta{color:var(--naranja);opacity:1}
.pill.urg{font-weight:600}

/* Hoy: barra del día + progreso */
.hoy-nav{background:var(--surface);border-radius:18px;padding:.45rem;margin-bottom:.8rem}
.hoy-nav > button{background:var(--bg);border-color:var(--line-soft);width:2.9rem;height:2.9rem;color:var(--pri-ink)}
.hoy-nav > button svg{width:1.4rem;height:1.4rem}
.hoy-nav-centro{gap:.05rem}
.hoy-etq{display:flex;align-items:center;gap:.45rem}

.hoy-nav .fecha{font-size:1.2rem;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.2}

.hero{border-left:0;background:none;padding:.1rem .2rem;margin-bottom:1rem;display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:.4rem}

.fila-tema{display:flex;align-items:center;gap:.8rem;padding:.7rem .2rem;flex-wrap:wrap}
.fila-tema .gl{width:2.3rem;height:2.3rem;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;background:var(--pri-soft);color:var(--pri-ink)}

/* formulario: fecha de fin plegable */
.btn-plazo{background:none;border:1px dashed var(--line);border-radius:12px;width:100%;padding:.6rem;color:var(--pri-ink);font-size:.86rem;cursor:pointer;margin:0 0 .85rem}

/* calendario: número de pendientes */
.dia{gap:.2rem}
.cnt{min-width:1.15rem;height:1.15rem;padding:0 .25rem;border-radius:99px;font-size:.66rem;font-weight:700;line-height:1.15rem;text-align:center;

/* celebración al completar el día */
.ole{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(15,23,28,.35);overflow:hidden;animation:oleIn .25s ease-out}
.ole.fuera{opacity:0;transition:opacity .4s}

  animation:olePop .45s cubic-bezier(.2,1.4,.4,1);max-width:85vw;border-top:5px solid var(--red)}

<script>
(function(){
"use strict";
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var MESES_C=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var DIAS=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
var CATEGORIAS=["Matriculación","Becas y ayudas","Alumnado","Personal","Documentación oficial","Inventario y compras","Comunicación","Órganos colegiados","Económico","Otros"];
var REPS={none:"No se repite",diaria:"Cada día laborable (lunes a viernes)",semanal:"Cada semana",mensual:"Cada mes",trimestral:"Cada trimestre",anual:"Cada curso"};
var TITULOS={chat:"Chat",hoy:"Agenda",calendario:"Calendario",tareas:"Tareas",manuales:"Manuales",mas:"Más"};

function $(s,c){return (c||document).querySelector(s);}
function el(t,a,txt){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else e.setAttribute(k,a[k]);}if(txt!=null)e.textContent=txt;return e;}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x;}
function parseISO(s){var p=String(s||"").split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
function hoyISO(){return iso(new Date());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtLargo(d){return DIAS[(d.getDay()+6)%7]+", "+d.getDate()+" de "+MESES[d.getMonth()];}
function diasEntre(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(function(){t.hidden=true;},2600);}
function curso(d){var y=d.getFullYear(),ini=d.getMonth()>=8?y:y-1;var s=Math.floor((d-new Date(ini,8,1))/604800000)+1;
  return {etiqueta:"Curso "+ini+"/"+String(ini+1).slice(2),semana:s};}

var state={diaHoy:null,siguiendoHoy:true,diasPasados:0,manuales:[],tareas:[],vista:"hoy",mes:new Date(),diaSel:hoyISO(),q:"",cat:null,qt:"",filtroT:"pendientes"};

/* ---------- almacenamiento local + sincronización con Supabase ---------- */
var SUPA_URL="https://fwehlxpahjxzpfpjoexv.supabase.co";
var SUPA_KEY="sb_publishable_MWCFJM_llZL_X3MZmPf9vw_CdpghVl5";
var TABLA="registros";

function lsGet(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var Store={
  modo:"local",
  async init(onChange){
    this.leer(); onChange(); pintarEstado();
    Sync.arrancar();
  },
  datosListos(){ return true; },
  leer(){state.manuales=lsGet("cs_manuales",[]);state.tareas=lsGet("cs_tareas",[]);},
  escribir(){lsSet("cs_manuales",state.manuales);lsSet("cs_tareas",state.tareas);},
  async guardar(col,obj){
    obj._mod=new Date().toISOString();
    var l=state[col],i=-1;for(var k=0;k<l.length;k++) if(l[k].id===obj.id) i=k;
    if(i>=0) l[i]=obj; else l.push(obj);
    this.escribir(); Sync.marcar(col,obj.id,false);
    render();
  },
  async borrar(col,id){
    state[col]=state[col].filter(function(o){return o.id!==id;});
    this.escribir(); Sync.marcar(col,id,true);
    render();
  }
};

var Sync={
  estado:"",          /* "", "sincronizando", "ok", "error", "sin-conexion" */
  ultima:lsGet("cs_ultima_sync",null),
  _timer:null,_enCurso:false,_otraVez:false,
  sesion(){return lsGet("cs_sesion",null);},
  conectado(){return !!this.sesion();},
  pendientes(){return lsGet("cs_pendientes",{});},
  marcar(col,id,borrado){
    if(!this.conectado()) return;
    var p=this.pendientes(); p[id]={c:col,b:!!borrado,n:Date.now()+"-"+Math.random().toString(36).slice(2,6)}; lsSet("cs_pendientes",p);
    this.programar(1500);
  },
  programar(ms){var self=this;clearTimeout(this._timer);this._timer=setTimeout(function(){self.sincronizar();},ms||0);},
  arrancar(){
    var self=this;
    if(!this.conectado()){
      if(!lsGet("cs_sin_cuenta",false)) setTimeout(abrirLogin,300);
      return;
    }
    this.sincronizar();
    if(!this._int){
      this._int=setInterval(function(){if(!document.hidden) self.sincronizar();},30000);
      document.addEventListener("visibilitychange",function(){if(!document.hidden) self.sincronizar();});
      window.addEventListener("online",function(){self.sincronizar();});
    }
  },

  /* --- peticiones --- */
  async _fetch(path,opt){
    opt=opt||{};
    var h={"apikey":SUPA_KEY,"Content-Type":"application/json"};
    if(opt.token) h["Authorization"]="Bearer "+opt.token;
    if(opt.headers) for(var k in opt.headers) h[k]=opt.headers[k];
    var r=await fetch(SUPA_URL+path,{method:opt.method||"GET",headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
    var txt=await r.text(),json=null;try{json=txt?JSON.parse(txt):null;}catch(e){}
    return {ok:r.ok,status:r.status,json:json};
  },
  _guardarSesion(j){
    if(!j||!j.access_token) return false;
    lsSet("cs_sesion",{access_token:j.access_token,refresh_token:j.refresh_token,
      expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),
      email:(j.user&&j.user.email)||"",user_id:(j.user&&j.user.id)||""});
    return true;
  },
  async _token(forzar){
    var s=this.sesion(); if(!s) return null;
    if(!forzar&&s.expires_at-60>Date.now()/1000) return s.access_token;
    var r=await this._fetch("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:s.refresh_token}});
    if(r.ok&&this._guardarSesion(r.json)) return this.sesion().access_token;
    if(r.status>=400&&r.status<500){ this._caducada(); }
    return null;
  },
  _caducada(){
    lsSet("cs_sesion",null); this.estado="";
    toast("La sesión ha caducado. Vuelve a entrar para sincronizar.");
    pintarEstado(); if(state.vista==="mas") render(); abrirLogin();
  },
  async _api(path,opt){
    var t=await this._token(false); if(!t) throw new Error("sin-sesion");
    opt=opt||{}; opt.token=t;
    var r=await this._fetch(path,opt);
    if(r.status===401){ t=await this._token(true); if(!t) throw new Error("sin-sesion"); opt.token=t; r=await this._fetch(path,opt); }
    if(!r.ok){var e=new Error("http-"+r.status);e.r=r;throw e;}
    return r.json;
  },

  /* --- cuenta --- */
  async entrar(email,pass,crear){
    var r;
    try{
      r=crear
        ? await this._fetch("/auth/v1/signup",{method:"POST",body:{email:email,password:pass}})
        : await this._fetch("/auth/v1/token?grant_type=password",{method:"POST",body:{email:email,password:pass}});
    }catch(e){ return "No hay conexión a internet. Inténtalo de nuevo."; }
    if(!r.ok){
      var j=r.json||{},c=j.error_code||j.code||"",m=(j.msg||j.error_description||j.message||"")+"";
      if(c==="invalid_credentials"||/invalid login/i.test(m)) return "Correo o contraseña incorrectos.";
      if(c==="user_already_exists"||/already registered/i.test(m)) return "Ya existe una cuenta con ese correo. Pulsa «Entrar».";
      if(c==="weak_password"||/password/i.test(m)) return "La contraseña es demasiado corta o débil (mínimo 8 caracteres).";
      if(c==="email_not_confirmed") return "Tienes que confirmar el correo antes de entrar.";
      if(c==="validation_failed"||/email/i.test(m)) return "Revisa que el correo esté bien escrito.";
      if(r.status===429) return "Demasiados intentos. Espera un minuto.";
      return "No se pudo entrar ("+(m||r.status)+").";
    }
    if(!this._guardarSesion(r.json)) return "Cuenta creada. Revisa tu correo para confirmarla y luego pulsa «Entrar».";
    lsSet("cs_sin_cuenta",null);
    /* lo que hubiera en este dispositivo se sube a la cuenta */
    var p=this.pendientes();
    state.manuales.forEach(function(o){if(!p[o.id])p[o.id]={c:"manuales",b:false,n:"ini"};});
    state.tareas.forEach(function(o){if(!p[o.id])p[o.id]={c:"tareas",b:false,n:"ini"};});
    lsSet("cs_pendientes",p);
    this.arrancar();
    return null;
  },
  async salir(){
    try{await this.sincronizar();}catch(e){}
    var s=this.sesion();
    if(s){try{await this._fetch("/auth/v1/logout",{method:"POST",token:s.access_token});}catch(e){}}
    lsSet("cs_sesion",null);lsSet("cs_pendientes",{});lsSet("cs_ultima_sync",null);
    lsSet("cs_sin_cuenta",true);
    this.estado="";this.ultima=null;
    render();pintarEstado();
  },

  /* --- sincronizar: subir cambios pendientes y descargar todo --- */
  async sincronizar(){
    if(!this.conectado()) return;
    if(this._enCurso){this._otraVez=true;return;}
    this._enCurso=true;this.estado="sincronizando";pintarEstado();
    try{
      var s=this.sesion(),p=this.pendientes(),ids=Object.keys(p),filas=[];
      ids.forEach(function(id){
        var x=p[id],obj=null;
        if(!x.b){var l=state[x.c]||[];for(var i=0;i<l.length;i++) if(l[i].id===id) obj=l[i];}
        var datos={};if(obj) for(var k in obj) if(k!=="id") datos[k]=obj[k];
        filas.push({id:id,user_id:s.user_id,coleccion:x.c,datos:datos,borrado:!obj,actualizado:new Date().toISOString()});
      });
      for(var a=0;a<filas.length;a+=200){
        await this._api("/rest/v1/"+TABLA+"?on_conflict=user_id,id",{method:"POST",body:filas.slice(a,a+200),
          headers:{"Prefer":"resolution=merge-duplicates,return=minimal"}});
      }
      /* quitar de pendientes solo lo que ya se subió (y no ha cambiado mientras tanto) */
      var p2=this.pendientes();
      ids.forEach(function(id){ if(p2[id]&&p2[id].n===p[id].n) delete p2[id]; });
      lsSet("cs_pendientes",p2);

      /* descargar */
      var remotos=[],desde=0,lote=1000;
      while(true){
        var r=await this._api("/rest/v1/"+TABLA+"?select=id,coleccion,datos,borrado&order=id&offset="+desde+"&limit="+lote);
        remotos=remotos.concat(r||[]);
        if(!r||r.length<lote) break; desde+=lote;
      }
      this._aplicar(remotos);
      this.ultima=new Date().toISOString();lsSet("cs_ultima_sync",this.ultima);
      this.estado="ok";
    }catch(e){
      if(e&&e.message==="sin-sesion"){this.estado="";}
      else if(e instanceof TypeError){this.estado="sin-conexion";}
      else{this.estado="error";this._detalle=(e&&e.r&&e.r.json&&(e.r.json.message||e.r.json.msg))||(e&&e.message)||"";}
    }
    this._enCurso=false;pintarEstado();
    if(this._otraVez){this._otraVez=false;this.programar(300);}
  },
  _aplicar(remotos){
    var p=this.pendientes(),vistos={},cambios=false;
    var nuevo={manuales:state.manuales.slice(),tareas:state.tareas.slice()};
    function idx(l,id){for(var i=0;i<l.length;i++) if(l[i].id===id) return i;return -1;}
    remotos.forEach(function(r){
      vistos[r.id]=true;
      if(p[r.id]) return;                 /* hay un cambio local más reciente sin subir */
      var col=r.coleccion==="manuales"?"manuales":"tareas",l=nuevo[col],i=idx(l,r.id);
      if(r.borrado){ if(i>=0){l.splice(i,1);cambios=true;} return; }
      var o=r.datos||{};o.id=r.id;
      if(i<0){l.push(o);cambios=true;}
      else if(JSON.stringify(l[i])!==JSON.stringify(o)){l[i]=o;cambios=true;}
    });
    /* lo que existe aquí pero no en la nube (y no está pendiente) se vuelve a subir */
    var falta=false;
    ["manuales","tareas"].forEach(function(col){nuevo[col].forEach(function(o){

/* ---------- repeticiones y rango de fechas ---------- */
function finTarea(t){ return t.fechaFin||t.fecha; }
function duracionTarea(t){ var f=finTarea(t); return f?Math.max(0,diasEntre(t.fecha,f)):0; }
/* Repeticiones:
   - "diaria": solo días laborables (lunes a viernes).
   - semanal / mensual / trimestral / anual: si la fecha cae en sábado o domingo,
     se adelanta al viernes anterior. */
function esFinde(d){var w=d.getDay();return w===0||w===6;}
function patronNominal(t,candidatoISO){
  if(candidatoISO<t.fecha) return false;
  var a=parseISO(t.fecha),b=parseISO(candidatoISO);
  if(t.repite==="semanal") return a.getDay()===b.getDay();
  if(t.repite==="mensual") return a.getDate()===b.getDate();
  if(t.repite==="trimestral"){if(a.getDate()!==b.getDate())return false;
    return (((b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()))%3)===0;}
  if(t.repite==="anual") return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  return false;
}
function patronCoincide(t,candidatoISO){
  if(!t.fecha) return false;
  if(!t.repite||t.repite==="none") return candidatoISO===t.fecha;
  var b=parseISO(candidatoISO);
  if(t.repite==="diaria") return candidatoISO>=t.fecha&&!esFinde(b);
  if(esFinde(b)) return false;                         /* nunca cae en fin de semana */
  if(patronNominal(t,candidatoISO)) return true;
  if(b.getDay()===5){                                  /* viernes: recoge el sábado y el domingo siguientes */
    for(var k=1;k<=2;k++){
      var n=iso(new Date(b.getFullYear(),b.getMonth(),b.getDate()+k));
      if(patronNominal(t,n)) return true;
    }
  }
  return false;
}
function primeraOcurrencia(t){
  if(!t.repite||t.repite==="none") return t.fecha;
  var d=parseISO(t.fecha);
  if(t.repite==="diaria"){while(esFinde(d)) d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return iso(d);}
  while(esFinde(d)) d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);
  return iso(d);
}
/* Fecha de inicio de la ocurrencia (del ciclo de repetición) a la que pertenece f, o null si f no cae en ninguna. */
/* Tareas con plazo (fecha de inicio y de fin, sin repetición): no se apuntan todos los días.
   Aparecen solo en UN día: hoy mientras están pendientes y dentro del plazo (van pasando al día siguiente),
   el día de inicio si todavía no ha empezado, el día en que se hicieron si ya están hechas,
   y el último día del plazo si se pasó sin hacer (atrasada). */
function esPlazoMovil(t){return t.tipo!=="reunion"&&(!t.repite||t.repite==="none")&&t.fechaFin&&t.fechaFin>t.fecha;}
function diaVisiblePlazo(t){
  if(t.hechas&&t.hechas[t.fecha]){
    var en=t.hechasEn&&t.hechasEn[t.fecha];
    return en||t.fechaFin;
  }
  var h=hoyISO();
  if(h<t.fecha) return t.fecha;
  if(h<=t.fechaFin) return h;
  return t.fechaFin;
}
function ocurrenciaEn(t,f){
  if(!t.fecha) return null;
  if(esPlazoMovil(t)) return f===diaVisiblePlazo(t)?t.fecha:null;
  var dur=duracionTarea(t), fd=parseISO(f);
  for(var i=0;i<=dur;i++){
    var cand=iso(new Date(fd.getFullYear(),fd.getMonth(),fd.getDate()-i));
    if(patronCoincide(t,cand)) return cand;
  }
  return null;
}
function ocurreEn(t,f){ return !!ocurrenciaEn(t,f); }
function claveOcurrencia(t,f){ return ocurrenciaEn(t,f)||f; }
function hecha(t,f){var c=claveOcurrencia(t,f);return !!(t.hechas&&t.hechas[c]);}
/* una tarea hecha cuyo día (o plazo) ya pasó queda cerrada: no se edita, ni se desmarca, ni se borra */
function finOcurrencia(t,f){var c=parseISO(claveOcurrencia(t,f));return iso(new Date(c.getFullYear(),c.getMonth(),c.getDate()+duracionTarea(t)));}
function bloqueada(t,f){
  if(!hecha(t,f)) return false;
  var h=hoyISO(); if(finOcurrencia(t,f)>=h) return false;
  var en=t.hechasEn&&t.hechasEn[claveOcurrencia(t,f)];
  return !(en&&en>=h);   /* si la marcaste hoy, puedes corregirla hasta que acabe el día */
}
function avisoBloqueada(){toast("Tarea cerrada: ya se hizo y su día ha pasado, no se puede modificar.");}
function tareasDe(f){return state.tareas.filter(function(t){return ocurreEn(t,f);})
  .sort(function(x,y){return (x.hora||"99")<(y.hora||"99")?-1:1;});}
function atrasadas(){var h=hoyISO(),o=[];
  state.tareas.forEach(function(t){var fin=finTarea(t);
    if(fin&&fin<h&&t.tipo!=="reunion"&&(!t.repite||t.repite==="none")&&!hecha(t,t.fecha))o.push({t:t,f:fin});});
  return o.sort(function(a,b){return a.f<b.f?-1:1;});}
function manualDe(t){for(var i=0;i<state.manuales.length;i++) if(state.manuales[i].id===t.manualId) return state.manuales[i];return null;}

/* ---------- barrido de los lunes ---------- */
/* Cada lunes a partir de las 8:00, las tareas (no reuniones, no repetitivas)
   que hayan quedado sin cerrar de antes se pasan a ese lunes marcadas como
   "no realizada" y se avisa con un mensaje. */
function intentarBarridoLunes(){
  return; /* desactivado: las pendientes atrasadas solo pasan a hoy con el botón «Pasar pendientes a hoy» de Más */
  if(!Store.datosListos()) return;
  var ahora=new Date();
  if(ahora.getDay()!==1||ahora.getHours()<8) return;
  var hoy=hoyISO(),flagKey="cs_barrido_hecho",yaHecho=null;
  try{yaHecho=localStorage.getItem(flagKey);}catch(e){}
  if(yaHecho===hoy) return;
  try{localStorage.setItem(flagKey,hoy);}catch(e){}
  var candidatos=pendientesAnteriores().filter(function(t){return t.estado!=="no_realizada";});
  if(!candidatos.length) return;
  var titulos=candidatos.map(function(t){return t.titulo;});
  candidatos.forEach(function(t){
    var o=JSON.parse(JSON.stringify(t));
    o.fechaOriginalInicio=o.fechaOriginalInicio||o.fecha;
    o.fechaOriginalFin=o.fechaOriginalFin||finTarea(t);
    o.fecha=hoy;o.fechaFin=hoy;o.estado="no_realizada";
    Store.guardar("tareas",o);
  });
  try{localStorage.setItem("cs_aviso_barrido",JSON.stringify({fecha:hoy,n:candidatos.length,titulos:titulos}));}catch(e){}
  toast("Lunes: "+candidatos.length+" tarea"+(candidatos.length===1?"":"s")+" sin cerrar se ha"+(candidatos.length===1?"":"n")+" pasado a hoy.");
}
/* tareas sin cerrar cuyo plazo terminó antes de hoy (no reuniones, no repetitivas) */
function pendientesAnteriores(){
  var hoy=hoyISO();
  return state.tareas.filter(function(t){
    return t.tipo!=="reunion"&&(!t.repite||t.repite==="none")&&t.fecha!==hoy&&
      finTarea(t)<hoy&&!hecha(t,t.fecha);
  });
}

/* markdown sencillo y seguro: negritas, cursivas, listas y títulos */
function mdSeguro(t){
  var lineas=escHTML(t).split("\n"),out=[],enLista=null;
  function cerrar(){if(enLista){out.push("</"+enLista+">");enLista=null;}}
  lineas.forEach(function(l){
    var fmt=function(x){return x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");};
    var m;
    if((m=/^\s*[-*•]\s+(.*)$/.exec(l))){if(enLista!=="ul"){cerrar();out.push("<ul>");enLista="ul";}out.push("<li>"+fmt(m[1])+"</li>");}
    else if((m=/^\s*(\d+)[.)]\s+(.*)$/.exec(l))){if(enLista!=="ol"){cerrar();out.push("<ol>");enLista="ol";}out.push("<li>"+fmt(m[2])+"</li>");}
    else{cerrar();if((m=/^#{1,6}\s+(.*)$/.exec(l)))out.push("<p><b>"+fmt(m[1])+"</b></p>");else if(l.trim())out.push("<p>"+fmt(l)+"</p>");}
  });
  cerrar();return out.join("");
}

var DIAS_PENDIENTES=30;
function coincideBusqueda(t,q){return !q||[t.titulo,t.notas,t.lugar,t.asistentes].join(" ").toLowerCase().indexOf(q)>=0;}
function sumarDias(f,n){var d=parseISO(f);return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));}
/* Todas las apariciones (una por cada repetición) que caen entre dos fechas.
   Incluye las de plazo que empezaron antes y siguen abiertas en "desde". */
function ocurrenciasEntre(desde,hasta,lista){
  var out=[];
  (lista||state.tareas).forEach(function(t){
    if(!t.fecha) return;
    if(!t.repite||t.repite==="none"){
      if(t.fecha<=hasta&&finTarea(t)>=desde) out.push({t:t,f:esPlazoMovil(t)?diaVisiblePlazo(t):t.fecha});
      return;
    }
    var ini=sumarDias(desde,-duracionTarea(t)-2),d=parseISO(ini),fin=parseISO(hasta);
    while(d<=fin){
      var f=iso(d);
      if(patronCoincide(t,f)&&finOcurrencia(t,f)>=desde) out.push({t:t,f:f});
      d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    }
  });
  return out;
}
function ordenOc(a,b){ if(a.f!==b.f) return a.f<b.f?-1:1; return (a.t.hora||"99")<(b.t.hora||"99")?-1:1; }
function limitesCurso(){
  var h=parseISO(hoyISO()),y=h.getMonth()>=8?h.getFullYear():h.getFullYear()-1;

}

  var tareasQ=state.tareas.filter(function(t){return coincideBusqueda(t,q);});
  var items;

    if(state.filtroT==="reuniones") items=items.filter(function(i){return i.t.tipo==="reunion";});
  }
  items.sort(ordenOc);
  if(!items.length){
    var v=el("div",{class:"vacio"});v.appendChild(el("p",null,q?"Nada coincide con la búsqueda.":"Nada en este filtro."));

function comp(f){return f.replace(/-/g,"");}
function z(x){return (x<10?"0":"")+x;}
function rrule(t){
  var LV="BYDAY=MO,TU,WE,TH,FR",d=parseISO(t.fecha),D=d.getDate();
  /* "el día D o, si cae en fin de semana, el viernes anterior" */
  var ajuste=D>=3?";BYMONTHDAY="+D+","+(D-1)+","+(D-2)+";"+LV+";BYSETPOS=-1":"";
  if(t.repite==="diaria")return "FREQ=WEEKLY;"+LV;
  if(t.repite==="semanal")return "FREQ=WEEKLY"+(esFinde(d)?";BYDAY=FR":"");
  if(t.repite==="mensual")return "FREQ=MONTHLY"+ajuste;
  if(t.repite==="trimestral")return "FREQ=MONTHLY;INTERVAL=3"+ajuste;
  return "FREQ=YEARLY;BYMONTH="+(d.getMonth()+1)+ajuste;
}
function calcularFinEvento(dIni,finDiaISO,t){
  var finDia=parseISO(finDiaISO);
  if(t.horaFin){
    var hf=t.horaFin.split(":");
    return new Date(finDia.getFullYear(),finDia.getMonth(),finDia.getDate(),+hf[0],+hf[1]);
  }
  var hm=t.hora.split(":");
  if(finDiaISO===iso(dIni)) return new Date(dIni.getFullYear(),dIni.getMonth(),dIni.getDate(),+hm[0]+1,+hm[1]);
  return new Date(finDia.getFullYear(),finDia.getMonth(),finDia.getDate(),+hm[0],+hm[1]);
}
function enlaceGoogle(t,f){
  var clave=claveOcurrencia(t,f);
  var dIni=parseISO(clave);
  var finDiaISO=iso(new Date(dIni.getFullYear(),dIni.getMonth(),dIni.getDate()+duracionTarea(t)));
  var fechas;
  if(t.hora){
    var hm=t.hora.split(":");
    var a=new Date(dIni.getFullYear(),dIni.getMonth(),dIni.getDate(),+hm[0],+hm[1]);
    var b=calcularFinEvento(dIni,finDiaISO,t);
    var loc=function(x){return x.getFullYear()+z(x.getMonth()+1)+z(x.getDate())+"T"+z(x.getHours())+z(x.getMinutes())+"00";};
    fechas=loc(a)+"/"+loc(b);
  }else{
    var finD=parseISO(finDiaISO);
    fechas=comp(clave)+"/"+comp(iso(new Date(finD.getFullYear(),finD.getMonth(),finD.getDate()+1)));
  }
  var p=["action=TEMPLATE","text="+encodeURIComponent(t.titulo),"dates="+fechas,
    "details="+encodeURIComponent(textoManual(t))];
  if(t.lugar) p.push("location="+encodeURIComponent(t.lugar));
  if(t.repite&&t.repite!=="none") p.push("recur="+encodeURIComponent("RRULE:"+rrule(t)));
  return "https://calendar.google.com/calendar/render?"+p.join("&");
}

function fold(l){var o=[],s=l;while(s.length>73){o.push(s.slice(0,73));s=" "+s.slice(73);}o.push(s);return o.join("\r\n");}

      var s=dIni.getFullYear()+z(dIni.getMonth()+1)+z(dIni.getDate())+"T"+z(+hm[0])+z(+hm[1])+"00";
      var e=calcularFinEvento(dIni,finDiaISO,t);
      L.push("DTSTART:"+s,"DTEND:"+e.getFullYear()+z(e.getMonth()+1)+z(e.getDate())+"T"+z(e.getHours())+z(e.getMinutes())+"00");
    }else{
      var finD=parseISO(finDiaISO);
      L.push("DTSTART;VALUE=DATE:"+comp(ini),
        "DTEND;VALUE=DATE:"+comp(iso(new Date(finD.getFullYear(),finD.getMonth(),finD.getDate()+1))));
    }
    if(t.repite&&t.repite!=="none") L.push("RRULE:"+rrule(t));
    if(t.lugar) L.push(fold("LOCATION:"+esc(t.lugar)));
    L.push(fold("SUMMARY:"+esc((t.tipo==="reunion"?"Reunión: ":"")+t.titulo)),fold("DESCRIPTION:"+esc(textoManual(t))));
    L.push("BEGIN:VALARM","TRIGGER:-P2D","ACTION:DISPLAY",fold("DESCRIPTION:"+esc(t.titulo)),"END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

/* ---------- puente con Android ---------- */
function esApp(){return !!(window.AdmSecAndroid);}
function guardarArchivo(nombre,mime,texto,okMsg){
  if(esApp()){ try{ window.AdmSecAndroid.guardarArchivo(nombre,mime,texto); return true; }catch(e){ toast("No se pudo guardar el archivo."); return false; } }
  try{
    var b=new Blob([texto],{type:mime}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=nombre;a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){toast("La descarga no está disponible aquí.");return false;}
}

function abrirImportar(){
  abrirSheet(function(sh){
    cabecera(sh,"Restaurar copia de seguridad");
    var p=el("p",null,"Elige un archivo .json exportado antes desde \"Copia de seguridad\". Puedes añadirlo a lo que ya tienes, o sustituirlo todo.");
    p.style.cssText="margin:0 0 .9rem;color:var(--muted);font-size:.9rem";sh.appendChild(p);
    var input=el("input",{type:"file",accept:"application/json,.json,text/plain,application/octet-stream"});
    input.style.cssText="width:100%;padding:.7rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:.9rem";
    sh.appendChild(input);
    var modoSel=el("select");
    modoSel.appendChild(el("option",{value:"anadir"},"Añadir a lo que ya tengo"));
    modoSel.appendChild(el("option",{value:"reemplazar"},"Sustituir todo lo actual"));
    sh.appendChild(campo("Cómo restaurar",modoSel));
    var acc=el("div",{class:"acciones"});
    var g=el("button",{class:"btn"},"Restaurar");
    g.addEventListener("click",function(){
      var f=input.files&&input.files[0];
      if(!f){toast("Elige primero un archivo.");return;}
      var r=new FileReader();
      r.onload=function(){
        var datos;
        try{ datos=JSON.parse(r.result); }catch(e){ toast("El archivo no es una copia válida."); return; }
        if(!datos||!Array.isArray(datos.tareas)||!Array.isArray(datos.manuales)){ toast("El archivo no es una copia válida."); return; }
        if(modoSel.value==="reemplazar"){
          state.manuales.slice().forEach(function(m){Store.borrar("manuales",m.id);});
          state.tareas.slice().forEach(function(t){Store.borrar("tareas",t.id);});
        }
        datos.manuales.forEach(function(m){ if(!m.id) m.id=uid(); Store.guardar("manuales",m); });
        datos.tareas.forEach(function(t){ if(!t.id) t.id=uid(); Store.guardar("tareas",t); });
        cerrarSheet();
        toast("Copia restaurada: "+datos.manuales.length+" manuales y "+datos.tareas.length+" tareas.");
      };
      r.onerror=function(){ toast("No se pudo leer el archivo."); };
      r.readAsText(f);
    });
    var c=el("button",{class:"btn sec"},"Cancelar");c.addEventListener("click",cerrarSheet);
    acc.appendChild(g);acc.appendChild(c);sh.appendChild(acc);
  });
}

    if(state.vista==="manuales") formManual();

    else abrirCreador(state.vista==="calendario"?state.diaSel:(state.vista==="hoy"?(state.diaHoy||hoyISO()):hoyISO()));
  }
  if(k==="mes-prev"){state.mes=new Date(state.mes.getFullYear(),state.mes.getMonth()-1,1);render();}
  if(k==="mes-next"){state.mes=new Date(state.mes.getFullYear(),state.mes.getMonth()+1,1);render();}

  if(k==="chat-borrar") borrarChat();
  if(k==="chat-mic"){ window.__destinoDictado="chat"; iniciarDictado(); }

});
